<!-- ═══════════════════════════════════════════
  VIDEOS DE FONDO
  - Agrega un <video> por cada proyecto
  - src: ruta a tu archivo .mp4
  - poster: frame estático de fallback (.jpg)
  - El primero tiene class "active" → se ve al cargar
═══════════════════════════════════════════ -->

  <video class="bg-video active" id="vid-0"

<!-- PROJECT LIST -->
<!--
  Para agregar un proyecto:
  1. Agrega un <video> arriba con el nuevo src
  2. Copia una línea .proj-link
  3. Cambia el texto y el data-vid al índice del video (0, 1, 2...)
  4. Cambia href al link de Vimeo
-->
<main class="projects-wrap">
  <div class="projects">
    <a class="proj-link" href="#" data-vid="0">Beneath the Canopy</a>
    <a class="proj-link" href="#" data-vid="1">4:47 AM</a>
    <a class="proj-link" href="#" data-vid="2">Drift</a>
    <a class="proj-link" href="#" data-vid="3">No Signal</a>
    <a class="proj-link" href="#" data-vid="4">Oleander</a>
  </div>
</main>

<script>
  // Cursor
 const cur = document.getElementById('cur');

// oculto hasta que el mouse se mueva
cur.style.opacity = '0';

document.addEventListener('mousemove', e => {
  cur.style.opacity = '1';
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
});
  // Video switcher
  const videos = document.querySelectorAll('.bg-video');
  let active = 0;

  function showVideo(i) {
    if (i === active) return;
    videos[active].classList.remove('active');
    videos[i].classList.add('active');
    active = i;
  }

  document.querySelectorAll('.proj-link').forEach(link => {
    link.addEventListener('mouseenter', () => {
      showVideo(parseInt(link.dataset.vid));
    });
  });
</script>

</body>
